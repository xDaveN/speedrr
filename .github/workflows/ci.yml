# Builds the image and runs the tests in it on every PR and push to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build the runtime image
        run: docker build --tag speedrr:test .
      - name: Check dependencies and application imports
        run: |
          docker run --rm --entrypoint python speedrr:test -m pip check
          docker run --rm --entrypoint python speedrr:test -c 'import main'
      - name: Test qBittorrent compatibility in the runtime image
        run: docker run --rm --network none --entrypoint python speedrr:test -m unittest discover -s tests -v
